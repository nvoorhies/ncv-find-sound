<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>find-sound</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
    --accent: #2f6fdf; --accent-ink: #ffffff; --chip: #eeece7; --bar: #2f6fdf33;
    --music: #7a4fd6; --sfx: #1f8a5b; --voice: #c2562b; --ambience: #2b7fa6;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9c9a94; --line: #33322f;
      --accent: #6d9cf0; --accent-ink: #0d1320; --chip: #2a2a27; --bar: #6d9cf044;
      --music: #a987f0; --sfx: #4fc28c; --voice: #ec8a5f; --ambience: #5fb6dc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  #status { color: var(--muted); font-size: 13px; }
  #status button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  form { margin-top: 18px; display: grid; gap: 10px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: var(--radius);
                  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .search input:focus, .filters input:focus, .filters select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary { font: inherit; font-weight: 600; padding: 0 18px; border-radius: var(--radius); border: 0;
                   background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
  .filters label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .filters input, .filters select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
                                    background: var(--panel); color: var(--ink); }
  .filters input[type=text] { width: 92px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .hint code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  #meta { color: var(--muted); font-size: 13px; margin: 18px 0 8px; min-height: 1em; }
  #error { color: var(--voice); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .top { display: flex; gap: 10px; align-items: baseline; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 1.4em; flex: none; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .rel { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; margin: 2px 0 8px 2.4em; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: 2.4em; }
  audio { height: 34px; flex: 1 1 260px; min-width: 200px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px 2.4em; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; color: var(--muted); }
  .chip.kind { color: var(--panel); font-weight: 600; }
  .chip.music { background: var(--music); } .chip.sfx { background: var(--sfx); }
  .chip.voice { background: var(--voice); } .chip.ambience { background: var(--ambience); }
  .actions { display: flex; gap: 12px; font-size: 13px; }
  .actions a, .actions button { color: var(--accent); background: none; border: 0; padding: 0; font: inherit;
                                cursor: pointer; text-decoration: none; }
  .score { margin-left: auto; width: 70px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; flex: none; }
  .score span { display: block; height: 100%; background: var(--accent); }
  details { margin: 8px 0 0 2.4em; font-size: 13.5px; }
  summary { cursor: pointer; color: var(--muted); }
  details ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
  details li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  details li .vname { flex: 1 1 200px; overflow-wrap: anywhere; }
  details audio { height: 30px; flex: 1 1 220px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>find-sound</h1>
    <div id="status">loading…</div>
  </header>
  <form id="form" autocomplete="off">
    <div class="search">
      <input id="q" name="q" type="search" placeholder="Describe the sound: heavy wooden door slam, tense synth loop, forest at night…" autofocus>
      <button class="primary" type="submit">Search</button>
    </div>
    <div class="filters">
      <label>kind
        <select id="kind"><option value="">any</option><option>sfx</option><option>music</option><option>ambience</option><option>voice</option></select>
      </label>
      <label>bpm <input id="bpm" type="text" placeholder="120-140"></label>
      <label>duration <input id="dur" type="text" placeholder="&lt;2 or 1-3"></label>
      <label>results
        <select id="k"><option>3</option><option selected>5</option><option>10</option><option>20</option></select>
      </label>
      <label><input id="group" type="checkbox" checked> group variants</label>
    </div>
    <div class="hint">Filters also work inside the query: <code>bpm:120-140</code> <code>dur:&lt;2</code> <code>kind:ambience</code> <code>in:foley</code>. Press <code>/</code> to search again.</div>
  </form>
  <div id="meta"></div>
  <ol id="results"></ol>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fields = ["q", "kind", "bpm", "dur", "k"];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function fmtDur(s) {
  if (s == null) return "";
  if (s < 60) return s < 10 ? `${s.toFixed(1)} s` : `${Math.round(s)} s`;
  return `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
}
function dirOf(rel) { const i = rel.lastIndexOf("/"); return i < 0 ? "" : rel.slice(0, i); }

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "copied"; }
  catch { btn.textContent = "copy failed"; }
  setTimeout(() => (btn.textContent = "copy path"), 1200);
}

function card(r, i, top) {
  const chips = [];
  if (r.kind) chips.push(`<span class="chip kind ${esc(r.kind)}">${esc(r.kind)}</span>`);
  if (r.duration != null) chips.push(`<span class="chip">${fmtDur(r.duration)}</span>`);
  if (r.bpm) chips.push(`<span class="chip" title="${r.bpm_source === "name" ? "from the file name" : "estimated from the audio"}">${r.bpm} bpm${r.bpm_source === "estimated" ? " (est.)" : ""}</span>`);
  if (r.duplicates.length) chips.push(`<span class="chip" title="${esc(r.duplicates.join("\n"))}">${r.duplicates.length} cop${r.duplicates.length > 1 ? "ies" : "y"}</span>`);
  const pct = Math.max(4, Math.min(100, 100 * r.score / Math.max(top, 1e-6)));
  const variants = r.variants.length ? `
    <details><summary>${r.variants.length} variant${r.variants.length > 1 ? "s" : ""}</summary><ul>
      ${r.variants.map((v) => `<li><span class="vname">${esc(v.name)}</span>
        <audio controls preload="none" src="${v.url}"></audio>
        <span class="actions"><a href="${v.download_url}">download</a></span></li>`).join("")}
    </ul></details>` : "";
  return `<li class="card">
    <div class="top"><span class="rank">${i + 1}</span><span class="name">${esc(r.name)}</span></div>
    <div class="rel" title="${esc(r.path)}">${esc(dirOf(r.rel))}</div>
    <div class="chips">${chips.join("")}</div>
    <div class="row">
      <audio controls preload="none" src="${r.url}"></audio>
      <span class="actions">
        <a href="${r.download_url}">download</a>
        <button type="button" data-path="${esc(r.path)}" class="copy">copy path</button>
      </span>
      <span class="score" title="score ${r.score.toFixed(2)} · audio ${r.audio_similarity.toFixed(3)} · name/tags ${r.text_similarity.toFixed(3)}"><span style="width:${pct}%"></span></span>
    </div>${variants}
  </li>`;
}

let inflight;
async function search(push = true) {
  const params = new URLSearchParams();
  for (const f of fields) if ($(f).value.trim()) params.set(f, $(f).value.trim());
  if (!$("group").checked) params.set("group", "false");
  if (!params.get("q") && !params.get("kind") && !params.get("bpm") && !params.get("dur")) return;
  if (push) history.pushState(null, "", "?" + params);
  inflight?.abort();
  inflight = new AbortController();
  $("meta").textContent = "searching…";
  try {
    const res = await fetch("/api/search?" + params, {signal: inflight.signal});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    const top = data.results.length ? data.results[0].score : 1;
    $("results").innerHTML = data.results.map((r, i) => card(r, i, top)).join("") ||
      `<li class="empty">No matches${data.filters ? " for " + esc(data.filters) : ""}.</li>`;
    $("meta").innerHTML = `${data.results.length} of ${data.searched.toLocaleString()} sounds${data.filters ? " · " + esc(data.filters) : ""} · ${data.ms} ms`;
    // Only one clip plays at a time.
    document.querySelectorAll("audio").forEach((a) => a.addEventListener("play", () =>
      document.querySelectorAll("audio").forEach((b) => b !== a && b.pause())));
  } catch (e) {
    if (e.name === "AbortError") return;
    $("results").innerHTML = "";
    $("meta").innerHTML = `<span id="error">${esc(e.message)}</span>`;
  }
}

function loadFromUrl() {
  const p = new URLSearchParams(location.search);
  for (const f of fields) if (p.has(f)) $(f).value = p.get(f);
  $("group").checked = p.get("group") !== "false";
  if (p.get("q") || p.get("kind")) search(false);
}

async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    const n = (s.searchable ?? s.files - s.missing_vectors).toLocaleString();
    let text = `${n} sounds indexed`;
    if (s.indexing && s.progress) text += ` · indexing ${s.progress.done.toLocaleString()}/${s.progress.queued.toLocaleString()}`;
    if (s.errors) text += ` · ${s.errors} unreadable`;
    $("status").innerHTML = `${esc(text)} · <button type="button" id="rescan" title="scan the library for new files now">rescan</button>`;
    $("rescan").onclick = async () => { await fetch("/api/rescan", {method: "POST"}); setTimeout(refreshStatus, 800); };
  } catch { $("status").textContent = "server unreachable"; }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); search(); });
["kind", "k", "group"].forEach((id) => $(id).addEventListener("change", () => search()));
$("results").addEventListener("click", (e) => {
  const b = e.target.closest("button.copy");
  if (b) copy(b.dataset.path, b);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); $("q").select(); }
});
window.addEventListener("popstate", loadFromUrl);
loadFromUrl();
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
