[project]
name = "ncv-find-sound"
version = "0.1.0"
description = "Find the right sound effect or music track for a text query, using a multimodal (audio+text) embedding model behind an OpenAI-compatible endpoint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "librosa>=0.10.2",
    "mutagen>=1.47",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "soxr>=0.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Reference CLAP embedding server (find-sound-embed-server). Only needed if you don't already
# run an audio-capable embedding server such as Infinity.
server = [
    "torch>=2.7",
    "transformers>=4.45",
]

[project.scripts]
find-sound = "find_sound.cli:main"
find-sound-embed-server = "find_sound.embed_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_sound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
